name: Week 6 Iris API CD

on:
  push:
    branches:
      - week-6-demo
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: iris-mlops
  IMAGE_NAME: iris-inference-api
  GKE_CLUSTER: iris-mlops-cluster
  GKE_ZONE: us-central1-a

jobs:
  test-api:
    name: Test inference API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run API tests
        run: pytest -q

  build-and-deploy:
    name: Build, push, and deploy
    if: github.event_name != 'pull_request'
    needs: test-api
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin,kubectl

      - name: Restore the validated DVC model
        run: |
          python -m pip install --upgrade pip
          pip install dvc==3.61.0 dvc-gs==3.0.2 pathspec==0.12.1
          dvc pull models/model.joblib.dvc

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          docker build --tag "${IMAGE_URI}:${GITHUB_SHA}" --tag "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials "${GKE_CLUSTER}" \
            --zone "${GKE_ZONE}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Deploy image to GKE
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          sed "s|IRIS_IMAGE_URI|${IMAGE_URI}|g" k8s/deployment.yaml > "${RUNNER_TEMP}/deployment.yaml"
          kubectl apply -f "${RUNNER_TEMP}/deployment.yaml"
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/iris-api --timeout=180s
          kubectl get pods
          kubectl get service iris-api
